const backgrounds={message:{enabled:true,url:'',name:''},profile:{enabled:true,url:'',name:''},other:{enabled:true,url:'',name:''}},originalHostLines=$('.hostlines').innerHTML;
let demoBarPNG=true,demoBarFullscreen=false,demoBarFloating=false,demoBarRadius=27,barExample=false,barSelected='messages';
function isEnabled(row){if(row.type==='bar_png')return demoBarPNG;if(row.type==='bar_fullscreen')return demoBarFullscreen;if(row.type==='bar_floating')return demoBarFloating;if(row.type==='card_toggle')return cardEnabled;if(row.type==='lottie_toggle')return demoLottie;if(row.type==='sheet_toggle')return demoSheet;return duo}
function refreshBackground(){const current=backgrounds[backgroundScene];$('#phone').style.backgroundImage=duo&&current.enabled&&current.url?`url("${current.url}")`:'';$('#phone').style.backgroundSize='cover';$('.hosthead strong').textContent=({message:'消息',profile:'我',other:'设置'})[backgroundScene];$('.stories').hidden=backgroundScene!=='message';if(backgroundScene==='message')$('.hostlines').innerHTML=originalHostLines;else{const list=$('.hostlines');list.replaceChildren();for(const label of backgroundScene==='profile'?['我的主页','作品与喜欢','收藏']:['账号与安全','隐私设置','通用设置']){const row=el('div','hostline');row.append(el('span','avatar'),el('div','',label));list.append(row)}}}
$('#demo-background').onclick=()=>{backgroundScene=({message:'profile',profile:'other',other:'message'})[backgroundScene];const bg=backgrounds[backgroundScene];bg.url=backgroundExamples[backgroundScene];bg.name='示例背景';bg.enabled=true;duo=true;render();close()};
function openSileoSource(){const url="sileo://source/https://h7ang0.github.io/taozi/";try{location.href=url}catch(e){}sheet('添加越狱源','在 iPhone 上会直接打开 Sileo，并把源地址预填进「添加源」。\nhttps://h7ang0.github.io/taozi/\n桌面浏览器打不开 Sileo 时，复制上面的地址手动粘贴即可。',[["\u590d\u5236\u6e90\u5730\u5740",()=>{navigator.clipboard.writeText("https://h7ang0.github.io/taozi/").catch(()=>{})}],['好',null]])};function activate(row){switch(row.type){case 'bar_png':demoBarPNG=!demoBarPNG;if(demoBarPNG)duo=true;render();break;case 'bar_fullscreen':demoBarFullscreen=!demoBarFullscreen;if(!demoBarFullscreen)demoBarFloating=false;else duo=true;render();break;case 'bar_floating':demoBarFloating=!demoBarFloating;if(demoBarFloating){demoBarFullscreen=true;duo=true}render();break;case 'bar_corner':sheet('底栏圆角','调整悬浮底栏四角',[['12 点',()=>{demoBarRadius=12;render()}],['20 点',()=>{demoBarRadius=20;render()}],['27 点',()=>{demoBarRadius=27;render()}],['取消',null]]);break;case 'lottie_toggle':demoLottie=!demoLottie;render();break;case 'sheet_toggle':demoSheet=!demoSheet;render();break;case 'sheet_corner':sheet('半屏面板圆角','选择顶部圆角',[['原生',()=>{demoSheetCorner=0;render()}],['24 点',()=>{demoSheetCorner=24;render()}],['30 点',()=>{demoSheetCorner=30;render()}],['取消',null]]);break;case 'card_toggle':cardEnabled=!cardEnabled;if(cardEnabled)duo=true;render();break;case 'card_file':$('#html-file').click();break;case 'card_height':sheet('卡片高度','选择消息卡片的高度',[['100 点',()=>{cardHeight=100;render()}],['160 点',()=>{cardHeight=160;render()}],['220 点',()=>{cardHeight=220;render()}],['取消',null]]);break;case 'card_clear':cardHTML='';cardName='';render();break;case 'duo_toggle':toggleDuo();break;case 'page':showPage(row.page);break;case 'theme_library':library();break;case 'theme_download':sheet('下载主题','网页不发起授权请求。请在抖音内通过 UID 与兑换码下载授权主题。',[['好',null]]);break;case 'theme_select':sheet('默认主题','iPhone 上会恢复默认资源并保留已下载主题。',[['好',null]]);break;case 'native_theme':sheet('背景设置','请在抖音内打开原生背景设置。',[['好',null]]);break;case 'font_picker':$('#font-file').click();break;case 'row_gap':sheet('设置项间距','选择卡片间的空隙',[['紧凑 · 8 点',()=>setGap(8)],['舒适 · 12 点',()=>setGap(12)],['宽松 · 16 点',()=>setGap(16)],['取消',null]]);break;case 'reset_layout':setGap(12);break;case 'sileo_source':openSileoSource();break;case 'about':sheet('ThemeDuo','版本 0.0.2-beta\n©小桃子 2026\n长按底部“我”打开面板\n「越狱源」可一键跳转 Sileo 添加官方源',[['好',null]]);break;}}
function refreshBottomBar(){const bar=$('.tabbar');bar.classList.toggle('floating',duo&&demoBarFloating&&demoBarFullscreen);bar.style.borderRadius=demoBarRadius+'px';for(const button of bar.querySelectorAll('[data-tab]')){const role=button.dataset.tab,selected=role===barSelected;button.setAttribute('aria-current',selected?'page':'false');button.replaceChildren();if(barExample&&demoBarPNG&&duo){const image=el('img','');image.src=bottomExamples['tab_'+role+'_'+(selected?'selected':'normal')];image.alt=({home:'首页',friends:'朋友',messages:'消息',me:'我'})[role]+(selected?'选中态':'普通态');button.append(image)}else button.textContent=({home:'首页',friends:'朋友',messages:'消息',me:'我'})[role]}}
for(const button of $('.tabbar').querySelectorAll('[data-tab]'))button.onclick=()=>{barSelected=button.dataset.tab;refreshBottomBar()};
$('#demo-bar').onclick=()=>{barExample=true;demoBarPNG=true;demoBarFullscreen=true;demoBarFloating=true;duo=true;render();close()};
function renderBrand(){const config=model[0].hero;if(stack.length||!config)return;const card=el('section','brandcard');card.setAttribute('aria-label','ThemeDuo 品牌卡片');const top=el('div','brandtop'),logo=el('div','brandlogo');logo.innerHTML=duoLogo;const text=el('div','brandtext');text.append(el('h2','brandtitle',config.title),el('div','brandcaption',config.subtitle));top.append(logo,text);const actions=el('div','brandactions'),toggle=el('button','brandaction'),theme=el('button','brandaction theme');toggle.innerHTML=duoLogo;toggle.append(el('span','',duo?'Duo 已开启':'开启 Duo'));toggle.setAttribute('aria-label','开启 Duo');toggle.setAttribute('aria-pressed',String(duo));toggle.onclick=toggleDuo;theme.innerHTML=duoLogo;theme.append(el('span','','主题美化'));theme.setAttribute('aria-label','主题美化');theme.onclick=()=>showPage(config.page);actions.append(toggle,theme);card.append(top,actions,el('div','brandcredit','THEMEDUO'));$('#table').append(card)}
function render(){$('#table').replaceChildren();renderBrand();$('#page-title').textContent=pageTitle;$('#back').hidden=stack.length===0;$('#panel').classList.toggle('subpage',stack.length>0);$('#panel').style.setProperty('--row-gap',gap+'px');for(const section of sections){const s=el('section','section');s.append(el('h2','sectiontitle',section.title));const items=el('div','items');for(const row of section.rows){const action=!['value','empty'].includes(row.type),toggle=['duo_toggle','card_toggle','lottie_toggle','sheet_toggle','bar_png','bar_fullscreen','bar_floating'].includes(row.type),isLink=row.type==='sileo_source',r=el(isLink?'a':(action?'button':'div'),'row glass'+(toggle&&(isEnabled(row))?' on':'')+(row.type==='empty'?' empty':''));if(action){if(isLink){r.href=SILEO_URL;r.setAttribute('role','link')}else{r.onclick=()=>activate(row)}r.setAttribute('aria-label',row.title)}if(toggle){r.setAttribute('role','switch');r.setAttribute('aria-checked',String(isEnabled(row)))}if(row.logo){const mark=el('span','mark logo');mark.innerHTML=duoLogo;r.append(mark)}else if(row.icon){const mark=el('span','mark');mark.innerHTML=icon(({'paintpalette':'palette','rectangle.3.group':'layout','arrow.down.circle':'download','square.stack.3d.up':'stack','rectangle.split.3x1':'layout','arrow.counterclockwise':'reset','textformat':'font','info.circle':'info'})[row.icon]||row.icon);r.append(mark)}const t=el('div','text');t.append(el('div','name',row.title));if(row.detail)t.append(el('div','detail',row.type==='card_file'&&cardName?cardName:row.detail));r.append(t);if(toggle)r.append(el('span','toggle'));else if(row.type==='value')r.append(el('span','value',row.value));else if(action){if(row.type==='card_height')r.append(el('span','value',cardHeight+' 点'));if(row.type==='bar_corner')r.append(el('span','value',demoBarRadius+' 点'));if(row.type==='row_gap')r.append(el('span','value',gap+' 点'));const c=el('span','chevron'+(row.selected?' selected':''));c.innerHTML=icon(row.type==='theme_select'?(row.selected?'check':'circle'):'chevron');r.append(c)}items.append(r)}s.append(items);$('#table').append(s)}refreshCard();refreshBackground();refreshBottomBar()}render();
</script></html>
